services:
  - type: web
    name: owner-finance-ai-pro-max-plus
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: DATABASE_URL
        sync: false
      - key: WORKSPACE_ENCRYPTION_KEY
        sync: false
      - key: OWNER_BOOTSTRAP_TOKEN
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: RENTCAST_API_KEY
        sync: false
